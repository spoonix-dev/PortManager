name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build PortManager.exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build (build.bat)
        shell: cmd
        run: call build.bat

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\PortManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PortManager.exe" | Out-File -Encoding ascii dist\PortManager.exe.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PortManager.exe
            dist/PortManager.exe.sha256
          generate_release_notes: true
          body: |
            **PortManager** — macOS-inspired Task Manager & Network Port Monitor for Windows.
            Open source by Mustafa Al-Aqrawi ([@spoonix-dev](https://github.com/spoonix-dev)) · MIT License.

            Download `PortManager.exe` below and run it. No installer, no dependencies.
